name: iOS speed-test app
on:
  workflow_dispatch:
  push:
    branches: [ios-bench]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Models from the website go into the app
        run: |
          mkdir -p ios-bench/Models
          cp waymark/ai/model/detector.onnx waymark/ai/model/resnet18.onnx waymark/ai/model/reallane.onnx ios-bench/Models/
          ls -la ios-bench/Models
      - name: Make the Xcode project
        run: brew install xcodegen && cd ios-bench && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios-bench
          xcodebuild -project WaymarkBench.xcodeproj -scheme WaymarkBench -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Pack the .ipa
        run: |
          cd ios-bench
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/WaymarkBench.app Payload/
          zip -qr WaymarkBench.ipa Payload && ls -la WaymarkBench.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: WaymarkBench-ipa
          path: ios-bench/WaymarkBench.ipa
