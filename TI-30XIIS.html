try{const v=ev(dm?dm[1]:m?m[1]:s);if(!isFinite(v))throw'OVERFLOW';S.ans=v;
if(m){if(m[2].charCodeAt(0)-65>=S.cap.v)throw'SYNTAX';S.vars[m[2]]=v}
S.out=dm?dms(v):show(v);S.hist.unshift(s);S.hist.length=Math.min(S.hist.length,S.cap.h);S.hi=-1;S.done=1;S.fd=0}
catch(x){S.err=typeof x=='string'?x:'SYNTAX';S.c=S.b.length;S.done=0}}
const letters=()=>Array.from({length:S.cap.v},(_,i)=>String.fromCharCode(65+i));
function menu(t,it,pick){S.menu={t,it,i:0,pick}}
function press(a,b){if(S.off){S.off=0;draw();return}
const x=S.sec&&a!='@sec'?b:a;if(a=='@sec'){S.sec=!S.sec;draw();return}S.sec=0;
if(S.err){S.err='';if(x=='@clr'){draw();return}}
const M=S.menu;if(M){const n=M.it.length;if(x=='@L'||x=='@U')M.i=(M.i+n-1)%n;else if(x=='@R'||x=='@D')M.i=(M.i+1)%n;
else if(x=='@ent'){S.menu=null;M.pick(M.it[M.i])}else if(x=='@clr')S.menu=null;draw();return}
if(!x){draw();return}
if(x[0]!='@'){ins(x);draw();return}
({'@clr'(){S.b=[];S.c=0;S.out='';S.done=0},'@off'(){S.b=[];S.c=0;S.out='';S.off=1},'@ent':ent,
'@del'(){if(S.de&&!S.b.length)return deDel();if(S.c<S.b.length)S.b.splice(S.c,1);else if(S.c>0)S.b.splice(--S.c,1)},
'@L'(){S.c=Math.max(0,S.c-1);S.done=0},'@R'(){S.c=Math.min(S.b.length,S.c+1);S.done=0},
'@U'(){if(S.de)return deMove(-1);if(S.stat)return;if(S.hist.length){S.hi=Math.min(S.hi+1,S.hist.length-1);S.b=S.hist[S.hi].match(TK);S.c=S.b.length;S.done=0;S.out=''}},
'@D'(){if(S.de)return deMove(1);if(S.stat)return;if(S.hi>0){S.hi--;S.b=S.hist[S.hi].match(TK);S.c=S.b.length}else{S.hi=-1;S.b=[];S.c=0}S.done=0},
'@drg'(){menu('DRG',['DEG','RAD','GRD'],v=>S.ang=v)},'@nt'(){menu('NOTATION',['FLO','SCI','ENG'],v=>S.nt=v)},
'@prb'(){menu('PRB',['nPr','nCr','!','RAND','RANDI'],v=>ins({RAND:'rand(',RANDI:'randi('}[v]||v))},
'@sto'(){menu('STO▸',letters(),v=>ins('▸'+v))},'@rcl'(){menu('RCL',letters(),v=>ins(v))},
'@hyp'(){S.hyp=!S.hyp},'@ins'(){S.insOnce=1},'@ang'(){menu('ANGLE',['°','′','″','r','g','▸DMS'],v=>ins(v))},'@rp'(){menu('R↔P',['R▸Pr','R▸Pθ','P▸Rx','P▸Ry'],v=>ins(v+'('))},'@k'(){if(S.K!=null||S.kdef){S.K=null;S.kdef=0}else S.kdef=1;S.b=[];S.c=0;S.out='';S.done=0},'@stat'(){menu('STAT',['1-VAR','2-VAR','CLRDATA'],v=>{if(v=='CLRDATA'){if(S.stat){S.sx=[];S.sy=[];S.sf=[];S.de=null}else S.err='STAT'}else{S.stat=v=='1-VAR'?1:2;S.sx=[];S.sy=[];S.sf=[];S.de=null;S.b=[];S.c=0;S.out='';S.done=0}})},'@data'(){if(!S.stat){S.err='STAT';return}if(S.de){deSort();S.de=null;S.b=[];S.c=0}else{S.de={fi:0};S.b=[];S.c=0;S.out=''}},'@sv'(){if(!S.stat||!S.sx.length){S.err='STAT';return}if(S.de){deSort();S.de=null;S.b=[];S.c=0}const nm=S.stat==1?['n','x̄','Sx','σx','Σx','Σx²']:['n','x̄','Sx','σx','Σx','Σx²','ȳ','Sy','σy','Σy','Σy²','Σxy','a','b','r','x′','y′'];menu('VAR',nm,v=>ins(/′$/.test(v)?v+'(':v));S.menu.vals=i=>{const k=nm[i];if(/′$/.test(k))return'';try{return show(sv(k))}catch(e){return String(e)}}},'@exitstat'(){if(!S.stat){S.err='STAT';return}menu('EXIT ST:',['Y','N'],v=>{if(v=='Y'){S.stat=0;S.sx=[];S.sy=[];S.sf=[];S.de=null;S.b=[];S.c=0;S.out='';S.done=0}})},'@memvar'(){menu('MEMVAR',letters().map(L=>L+'='+show(S.vars[L]||0).slice(0,8)),()=>{})},'@clrvar'(){S.vars={}},'@fix'(){menu('FIX',['F',...Array.from({length:10},(_,i)=>String(i))],v=>S.fix=v=='F'?null:+v)},'@reset'(){Object.assign(S,{b:[],c:0,out:'',done:0,vars:{},hist:[],ans:0,ang:'DEG',nt:'FLO',fix:null,fr:0,fd:0,mix:1,hyp:0,K:null,kdef:0,stat:0,sx:[],sy:[],sf:[],de:null,insOnce:0})},'@fd'(){S.fd=!S.fd;if(S.done)S.out=show(S.ans)},'@mix'(){S.mix=!S.mix;if(S.done)S.out=show(S.ans)}})[x]();draw()}
function draw(){const L1=$('l1'),L2=$('l2');
$('ind').innerHTML=S.off?'':[S.sec&&'2nd',S.hyp&&'HYP',S.nt!='FLO'&&S.nt,S.fix!=null&&'FIX',S.stat&&'STAT',S.K!=null&&'K',S.ang].filter(Boolean).map(t=>`<span>${t}</span>`).join('');
if(S.off){L1.textContent=L2.textContent='';return}
if(S.err){L1.textContent=S.err;L2.textContent='';return}
if(S.menu){const M=S.menu,s0=Math.max(0,Math.min(M.i-2,M.it.length-4));L1.textContent=M.vals?(M.t+' '+M.it[M.i]).slice(0,12):M.t;L2.textContent=M.vals?M.vals(M.i):M.it.map((q,i)=>i==M.i?'['+q+']':q).slice(s0).join(' ').slice(0,12);return}
if(S.de){L1.textContent=(deLab()+(S.b.length?S.b.join(''):deVal())).slice(-12);L2.textContent='';return}
const pre=S.b.slice(0,S.c).join(''),post=S.b.slice(S.c).join(''),px=S.kdef?'K=':'',st=Math.max(0,px.length+pre.length-10);
L1.textContent=S.done?(pre+post).slice(0,12):(px+pre+'▏'+post).slice(st,st+12);
L2.textContent=S.out||(S.b.length||S.stat?'':'0.')}
const sld=[['v','Memory variables',1,26,v=>`${v} (A–${String.fromCharCode(64+v)})`],['h','Entry history',1,200,v=>v+' entries'],['e','Entry length',20,500,v=>v+' chars'],['p','Paren levels',1,100,v=>v+' levels'],['s','Stat data points',1,500,v=>v+' points']];
const box=$('sls');
sld.forEach(([k,n,lo,hi,f])=>{const d=document.createElement('div');d.className='sl';d.innerHTML=`<span>${n}</span><b id="v${k}"></b><input id="s${k}" type="range" min="${lo}" max="${hi}" value="${S.cap[k]}" aria-label="${n}">`;box.appendChild(d);
d.querySelector('input').oninput=e=>{S.cap[k]=+e.target.value;S.hist.length=Math.min(S.hist.length,S.cap.h);sync(1)}});
$('m').oninput=e=>{const m=+e.target.value;for(const k in BASE)S.cap[k]=Math.min(MAX[k],Math.round(BASE[k]*m));sync()};
function sync(custom){sld.forEach(([k,,,,f])=>{$('v'+k).textContent=f(S.cap[k]);$('s'+k).value=S.cap[k]});
$('vm').textContent=custom?'custom':(+$('m').value+'×')}
sync();draw();
