<!doctype html><img id=im src="_lt.jpg"><script type=module>
const ort = await import('../ort/ort.min.mjs'); ort.env.wasm.wasmPaths = new URL('../ort/', location.href).href; ort.env.wasm.numThreads = 1;
const s = await ort.InferenceSession.create('reallane.onnx', { executionProviders: ['wasm'] });
const im = document.getElementById('im'); await im.decode();
const c = document.createElement('canvas'); c.width = 192; c.height = 256; const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(im, 0, 0, 480, 640, 0, 0, 192, 256);
const p = g.getImageData(0, 0, 192, 256).data, n = 192 * 256, x = new Float32Array(3 * n);
for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++) x[k * n + i] = p[i * 4 + k] / 255;
const t0 = performance.now(); const out = await s.run({ image: new ort.Tensor('float32', x, [1, 3, 256, 192]) });
document.title = 'done ' + Array.from(out.x.data).map((v) => v.toFixed(4)).join(' ') + ' ' + Math.round(performance.now() - t0) + 'ms';
</script>
